version: "3.8"

services:
  app:
    image: ${DOCKERHUB_USERNAME}/ctfrbt-app:${IMAGE_TAG:-latest}
    ports:
      - "${APP_PORT}:3000"
    environment:
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
    networks:
      - ctfrbt-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        order: stop-first

  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - ctfrbt-network
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

  # Web gateway (#5): routes wildcard subdomains to instance containers.
  # The orchestrator (not in this stack yet) writes one dynamic entry per
  # instance into the shared volume.
  gateway:
    image: traefik:v3.1
    command:
      - --entrypoints.web.address=:80
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    ports:
      - "8088:80"
    volumes:
      - gateway_data:/etc/traefik/dynamic
    networks:
      - ctfrbt-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  ctfrbt-network:
    driver: overlay

volumes:
  pgdata:
  gateway_data:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: ctfrbt-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://ctfrbt:ctfrbt@postgres:5432/ctfrbt
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-this-to-a-random-secret}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      ORCHESTRATOR_URL: http://orchestrator:7474
      ORCHESTRATOR_SECRET: ${ORCHESTRATOR_SECRET:-change-this-to-a-random-secret}
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_started
    volumes:
      - uploads_data:/app/public/uploads

  # Manages challenge containers over the host's Docker Engine socket.
  # Works with Docker and podman: set DOCKER_SOCKET_PATH accordingly.
  # The socket must belong to the same user context as the stack: a
  # rootless podman stack cannot reach a rootful Docker socket (EACCES),
  # and vice versa. On this host (rootless podman):
  #   DOCKER_SOCKET_PATH=/run/user/1000/podman/podman.sock
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: orchestrator-runner
    container_name: ctfrbt-orchestrator
    restart: unless-stopped
    environment:
      ORCHESTRATOR_SECRET: ${ORCHESTRATOR_SECRET:-change-this-to-a-random-secret}
      DOCKER_SOCKET_PATH: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:${DOCKER_SOCKET_PATH:-/var/run/docker.sock}

  postgres:
    image: postgres:18.4-alpine
    container_name: ctfrbt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ctfrbt
      POSTGRES_PASSWORD: ctfrbt
      POSTGRES_DB: ctfrbt
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctfrbt -d ctfrbt"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:18.4-alpine
    container_name: ctfrbt-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ctfrbt
      POSTGRES_PASSWORD: ctfrbt
      POSTGRES_DB: ctfrbt_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctfrbt -d ctfrbt_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads_data:
